name: tether
label: Hermes Tether
version: 0.3.1
author: James Reed (developed with AI)
manifest_version: 2
api_version: 1
license: MIT
requires_hermes: ">=0.23.3"
description: Give one remote Hermes agent the local capabilities of your paired desktop machines (terminal, files, its own tools), over a pinned, 256-bit TLS 1.3 link; every session is approved once at the machine with a code from the person's authenticator app
provides_tools:
  - devices
provides_hooks:
  - pre_llm_call
  - post_llm_call
  - transform_tool_result
provides_middleware:
  - tool_execution
tags: [remote, devices, desktop, security]
config_schema:
  role: {type: string, default: "off", description: "off | host | device (both: host,device). Off does nothing."}
  name: {type: string, default: "", description: "This device's name as the host shows it (device role)"}
  listen: {type: string, default: "", description: "host:port the host listens on (host role); use a LAN or tailnet address"}
  grant_idle_minutes: {type: float, default: 60, description: "Device: minutes without remote use before a session's grant lapses and the person at the machine must allow it again"}
  consent_timeout_seconds: {type: float, default: 60, description: "Device: how long the approval box waits for a code from your authenticator app (20-600 s); no code means deny"}
  allow_unlocked_commands: {type: bool, description: "Device: run a remote session's commands without the session lock (unset: on for Windows, which has no lock; off for macOS). Also on the Tether panel; a change applies once no remote session is connected"}
